gates = ["format", "build"]
verification = "gate"
hold = false
pause_after = false
brief = """
Serves AC-1 of docs/spec-email-events.md. Edit apps/docs/src/content/docs/guides/roadmap.md only.

1. In the Planned table, add this row after the "Viewing and exporting consent records" row (March 2027) and before
   "The other planned providers" (Q2 2027):
   | [Email events from sending services](#email-events-from-sending-services) | Medium | April 2027 |
2. Add this section after the "### Viewing and exporting consent records" section and before
   "### A hosted consent service":

### Email events from sending services

ConsentLayer tracks what visitors do on your site. What happens to the email
your application sends, whether it was delivered, bounced, opened or clicked,
is reported only by the sending service, each in its own webhook format. The
planned `consentlayer/email` handler receives those webhooks from Resend,
Postmark, SendGrid, Mailgun and Amazon SES, verifies each one with Web Crypto,
and turns it into one set of events, such as `email_delivered`,
`email_bounced` and `email_opened`. Opens and clicks pass only for recipients
your consent check allows, opens likely made by a privacy proxy are flagged,
and the events can be sent to PostHog and GA4. ConsentLayer adds no tracking
pixel and rewrites no links: it reads only the events the service already
sends. Amazon SES events through EventBridge and Resend's unsubscribe events
are planned for a later release.

Run pnpm format, then pnpm --filter docs build. Do not claim legal compliance anywhere.
"""

