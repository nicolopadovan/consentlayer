name: Publish Package

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.4.1

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify package
        run: pnpm turbo run typecheck lint test build --filter consentlayer

      # npm (not pnpm) publishes, so npm's trusted publishing (OIDC) applies: no token.
      - name: Publish package
        working-directory: packages/consentlayer
        run: |
          version=$(node -p "require('./package.json').version")
          if [[ "$version" == *-* ]]; then npm publish --tag next; else npm publish; fi
