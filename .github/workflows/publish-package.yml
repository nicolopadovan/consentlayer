name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: release

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      unpublished: ${{ steps.check.outputs.unpublished }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile

      # Opens or updates the "Release consentlayer" pull request while changesets are pending.
      - uses: changesets/action@v2
        with:
          version-script: pnpm changeset version
          commit-message: 'chore: release consentlayer'
          pr-title: Release consentlayer
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - id: check
        run: |
          version=$(node -p "require('./packages/consentlayer/package.json').version")
          if npm view "consentlayer@$version" version --silent >/dev/null 2>&1; then
            echo "unpublished=false" >> "$GITHUB_OUTPUT"
          else
            echo "unpublished=true" >> "$GITHUB_OUTPUT"
          fi

  publish:
    needs: version
    if: needs.version.outputs.unpublished == 'true'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: |
          pnpm turbo run typecheck lint test build --filter consentlayer
          pnpm --filter consentlayer check:package

      # npm (not pnpm) publishes, so npm's trusted publishing (OIDC) applies: no token.
      - name: Publish
        working-directory: packages/consentlayer
        run: |
          version=$(node -p "require('./package.json').version")
          if [[ "$version" == *-* ]]; then npm publish --tag next; else npm publish; fi
          git -c user.name=github-actions[bot] -c user.email=41898282+github-actions[bot]@users.noreply.github.com \
            tag -a "consentlayer@$version" -m "consentlayer@$version"
          git push origin "consentlayer@$version"
